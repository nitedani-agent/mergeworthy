name: check
on: [push, pull_request]
jobs:
  graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v6  # tests/review-context.sh fetches TypeScript with pnpm, as on a pnpm-only machine
        with:
          version: 12
      - run: npm install && npm install --prefix cli
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0  # Ubuntu 24.04 blocks the user namespaces mw netns runs in
      - run: bash tests/all.sh .
